            position: relative;

            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .academic-flashcard:hover {
            border-color: #b61722;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(182, 23, 34, 0.08);
        }
        ruby { ruby-position: over; }
        rt { font-family: 'Inter', sans-serif; }

                    <option value="vocab">Vocabulary</option>
                    <option value="verb">Verb Forms (Te/Ta/Nai/Jisho)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-secondary mb-1.5 uppercase tracking-wider">Chapter Isolation</label>
                <select id="filter-chapter-id" class="w-full bg-gray-50 border border-border-stable rounded-lg py-2.5 px-3 text-sm focus:border-primary focus:ring-0 outline-none">
                    <option value="all">Display All Lessons</option>

        </section>

        <div class="flex flex-wrap gap-4 text-xs font-bold text-secondary tracking-wide uppercase px-1">

    <script src="data-vocab.js"></script>
    <script src="data-kanji.js"></script>
    <script src="dict-plt.js"></script>
    <script>
        function renderCards() {
            const container = document.getElementById('deck-grid-container');
            const searchStr = document.getElementById('filter-search-string').value.toLowerCase();
            const typeFilter = document.getElementById('filter-item-type').value;
            const chapterFilter = document.getElementById('filter-chapter-id').value;

            let dataset = [];
            if (typeFilter === 'vocab' && typeof vocabData !== 'undefined') dataset = vocabData;
            if (typeFilter === 'kanji' && typeof kanjiData !== 'undefined') dataset = kanjiData;
            if (typeFilter === 'verb' && typeof dictData !== 'undefined') dataset = dictData;

            let filtered = dataset.filter(item => {
                // Chapter Filter Check
                if (chapterFilter !== 'all' && item.lesson != chapterFilter) return false;
                
                // Search String Query Matching
                if (searchStr) {
                    let mainMatch = (
                        (item.japanese && item.japanese.toLowerCase().includes(searchStr)) ||
                        (item.romaji && item.romaji.toLowerCase().includes(searchStr)) ||
                        (item.meaningEnglish && item.meaningEnglish.toLowerCase().includes(searchStr)) ||
                        (item.meaningBangla && item.meaningBangla.includes(searchStr))
                    );

                    let exampleMatch = false;
                    if (item.examples) {
                        exampleMatch = item.examples.some(ex => 
                            (ex.japanese && ex.japanese.toLowerCase().includes(searchStr)) ||
                            (ex.romaji && ex.romaji.toLowerCase().includes(searchStr)) ||
                            (ex.meaningEnglish && ex.meaningEnglish.toLowerCase().includes(searchStr)) ||
                            (ex.meaningBangla && ex.meaningBangla.includes(searchStr))
                        );
                    }
                    if (!mainMatch && !exampleMatch) return false;
                }
                return true;
            });

            document.getElementById('ui-filtered-total').textContent = filtered.length;
            container.innerHTML = '';
            
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "academic-flashcard";
                
                let examplesHTML = '';
                if (item.examples && item.examples.length > 0) {
                    const lis = item.examples.map(ex => `<li class="border-b border-dashed border-gray-100 last:border-0 pb-1.5 last:pb-0"><strong class="text-tertiary font-jp text-[13px] mr-1">${ex.japanese}</strong><span class="text-secondary mr-1">(${ex.romaji})</span> - ${ex.meaningEnglish} / ${ex.meaningBangla}</li>`).join('');
                    examplesHTML = `
                        <div class="mt-4 pt-3 border-t border-gray-100 flex-grow flex flex-col justify-end">
                            <p class="text-[10px] font-bold text-secondary mb-1.5 uppercase tracking-wider">Example Vocabulary</p>
                            <ul class="text-[11px] space-y-1.5 leading-tight">${lis}</ul>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-4xl font-bold font-jp text-primary">${item.japanese || item.kanji}</h3>
                            <span class="text-[10px] font-bold text-tertiary uppercase bg-teal-50 border border-teal-100 px-2 py-0.5 rounded">Lesson ${item.lesson}</span>
                        </div>
                        <p class="text-[15px] font-mono font-bold text-slate-800 mb-0.5">${item.romaji}</p>
                        <p class="text-sm text-secondary font-medium">${item.meaningEnglish} / ${item.meaningBangla}</p>
                    </div>
                    ${examplesHTML}
                `;
                container.appendChild(card);
            });
        }

        function populateChapters() {
            const typeFilter = document.getElementById('filter-item-type').value;
            const select = document.getElementById('filter-chapter-id');
            let dataset = [];
            
            if (typeFilter === 'vocab' && typeof vocabData !== 'undefined') dataset = vocabData;
            if (typeFilter === 'kanji' && typeof kanjiData !== 'undefined') dataset = kanjiData;
            if (typeFilter === 'verb' && typeof dictData !== 'undefined') dataset = dictData;

            const chapters = new Set();
            dataset.forEach(item => chapters.add(item.lesson));
            
            select.innerHTML = '<option value="all">Display All Lessons</option>';
            Array.from(chapters).sort((a,b)=>a-b).forEach(ch => {
                select.innerHTML += `<option value="${ch}">Lesson ${ch}</option>`;
            });
        }

        document.getElementById('filter-search-string').addEventListener('input', renderCards);
        document.getElementById('filter-item-type').addEventListener('change', () => { 
            populateChapters(); 
            renderCards(); 
        });
        document.getElementById('filter-chapter-id').addEventListener('change', renderCards);

        window.onload = () => { 
            populateChapters(); 
            renderCards(); 
        };
    </script>
</body>
