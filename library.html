<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vocabulary Library</title>
    <link rel="icon" type="image/x-icon" href="ico.png"> 
    <script src="tailwind.js"></script>
   
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "border-stable": "#E5E7EB", "primary": "#b61722", "secondary": "#555f6f",
                        "tertiary": "#006765", "background": "#f9f9ff", "on-surface": "#151c27"
                    }
                }
            }
        }
    </script>
    <style>
        .academic-flashcard {
            background: #ffffff; border: 1px solid #E5E7EB; border-radius: 16px; padding: 24px;
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: border-color 0.2s; cursor: pointer;
        }
        .academic-flashcard:hover { border-color: #cbd5e1; }
        .academic-flashcard:focus-visible { outline: 2px solid #b61722; outline-offset: 2px; }
        ruby { ruby-position: over; }
        rt { font-family: 'Inter', sans-serif; }
    </style>
<style>.ico{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}</style>
</head>
<body class="bg-background text-on-surface font-sans pb-24 md:pb-8">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></symbol>
<symbol id="i-quiz" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.25c-.75.4-1.1.9-1.1 1.75"/><path d="M12 17h.01"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10.5 5.3 8.5 4.5 6 4.5H3v13h3c2.5 0 4.5.8 6 2 1.5-1.2 3.5-2 6-2h3v-13h-3c-2.5 0-4.5.8-6 2z"/><path d="M12 6.5v13"/></symbol>
<symbol id="i-kanji" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M12 3.5v17M3.5 12h17"/></symbol>
<symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2.5 4.5 13.5H11L10 21.5l8.5-11H12.5z"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4 2.6 17.5a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4M12 17h.01"/></symbol>
<symbol id="i-alert-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5M12 16h.01"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c0-3.6 3.6-6 8-6s8 2.4 8 6"/></symbol>
<symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.3 2.4 2.4 4.6-4.9"/></symbol>
<symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.6-4.6"/></symbol>
<symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5v1.5A3 3 0 0 0 8 10.5M16 6h3v1.5a3 3 0 0 1-3 3M12 13v4M9 20h6M10 17h4"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
</svg>


    <header class="bg-white border-b border-border-stable sticky top-0 z-40 h-16">
        <div class="flex justify-between items-center w-full px-4 md:px-8 max-w-[1024px] mx-auto h-16">
            <div class="flex items-center gap-2 text-xl font-bold text-primary">
                <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center text-primary font-black">日</div>
                <span>Nihongo Nichi</span>
            </div>
            <nav class="hidden md:flex items-center space-x-6 h-full text-sm"><a class="text-secondary font-medium hover:text-primary h-full flex items-center px-2" href="index.html">Dashboard</a><a class="text-secondary font-medium hover:text-primary h-full flex items-center px-2" href="quiz.html">Quiz</a><a class="text-primary font-bold border-b-2 border-primary h-full flex items-center px-2" href="library.html">Library</a></nav>
        </div>
    </header>

    <main class="max-w-[1024px] mx-auto px-4 md:px-8 py-6 space-y-6">
        <section class="bg-gradient-to-r from-red-900 to-primary rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
            <div class="relative z-10 space-y-1"><h1 class="text-2xl font-extrabold tracking-tight">Library</h1><p class="text-red-100 text-sm max-w-xl">Browse every card, tap to hear it, and see where each word stands.</p></div>
            <div class="absolute -right-6 -bottom-8 opacity-[0.15] text-8xl font-black select-none pointer-events-none">日本語</div>
        </section>
        
        <section class="bg-white border border-border-stable p-4 rounded-2xl shadow-sm grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div class="md:col-span-2">
                <label class="block text-xs font-bold text-secondary mb-1.5 uppercase tracking-wider">Search Database Records</label>
                <div class="relative">
                    <svg class="ico w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" aria-hidden="true"><use href="#i-search"/></svg>
                    <input id="filter-search-string" class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-border-stable rounded-lg focus:border-primary focus:ring-0 outline-none text-sm" placeholder="Search Romaji, English, Bangla..." type="text">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-secondary mb-1.5 uppercase tracking-wider">Item Type</label>
                <select id="filter-item-type" class="w-full bg-gray-50 border border-border-stable rounded-lg py-2.5 px-3 text-sm focus:border-primary focus:ring-0 outline-none">
                    <option value="vocab">Vocabulary</option>
                    <option value="kanji">Kanji</option>
                    <option value="verb">Verb Forms (Te/Ta/Nai/Jisho)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-secondary mb-1.5 uppercase tracking-wider">Chapter Isolation</label>
                <select id="filter-chapter-id" class="w-full bg-gray-50 border border-border-stable rounded-lg py-2.5 px-3 text-sm focus:border-primary focus:ring-0 outline-none">
                    <option value="all">Display All Lessons</option>
                </select>
            </div>
        </section>

        <div class="flex flex-wrap gap-3 text-xs font-semibold text-slate-500"><div class="bg-white border border-border-stable rounded-lg px-3 py-1.5">Cards found <span id="ui-filtered-total" class="text-primary font-bold">0</span></div><div class="bg-white border border-border-stable rounded-lg px-3 py-1.5">Mastered <span id="ui-mastered-total" class="text-emerald-600 font-bold">0</span></div><div class="bg-white border border-border-stable rounded-lg px-3 py-1.5">Learning <span id="ui-learning-total" class="text-blue-600 font-bold">0</span></div></div>

        <div id="deck-grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-border-stable py-2 px-6 flex justify-around items-center z-40 md:hidden"><a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 font-medium"><svg class="ico w-5 h-5" aria-hidden="true"><use href="#i-home"/></svg><span class="text-[10px]">Home</span></a><a href="quiz.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 font-medium"><svg class="ico w-5 h-5" aria-hidden="true"><use href="#i-quiz"/></svg><span class="text-[10px]">Quiz</span></a><a href="library.html" class="flex flex-col items-center gap-1 text-primary font-bold"><svg class="ico w-5 h-5" aria-hidden="true"><use href="#i-book"/></svg><span class="text-[10px]">Library</span></a></nav>

    <script src="data-vocab.js"></script>
    <script src="data-kanji.js"></script>
    <script src="dict-plt.js"></script>
    <script src="app.js"></script>
    <script>
        let isFirstLoad = true; 

        document.addEventListener('DOMContentLoaded', () => {
            initializeFilterDropdownOptions();
            executeGridSyncRender();

            document.getElementById('filter-search-string').addEventListener('input', executeGridSyncRender);
            document.getElementById('filter-chapter-id').addEventListener('change', executeGridSyncRender);
            document.getElementById('filter-item-type').addEventListener('change', () => {
                initializeFilterDropdownOptions();
                executeGridSyncRender();
            });
        });

        function getActiveDataset() {
            const type = document.getElementById('filter-item-type').value;
            if (type === 'kanji' && typeof kanjiData !== 'undefined') {
                return kanjiData;
            }
            if (type === 'verb' && typeof dictData !== 'undefined') {
                return dictData;
            }
            return typeof vocabData !== 'undefined' ? vocabData : [];
        }

        function initializeFilterDropdownOptions() {
            const dropdown = document.getElementById('filter-chapter-id');
            const savedValue = dropdown.value;
            dropdown.innerHTML = '<option value="all">Display All Lessons</option>';
            
            const targetData = getActiveDataset();
            
            const sortedLessons = [...new Set(targetData.map(v => v.lesson))].sort((a,b) => {
                const numA = parseInt(a);
                const numB = parseInt(b);
                if (isNaN(numA) && isNaN(numB)) return String(a).localeCompare(String(b));
                if (isNaN(numA)) return 1;
                if (isNaN(numB)) return -1;
                return numA - numB;
            });
            
            sortedLessons.forEach(num => {
                const opt = document.createElement('option');
                opt.value = num;
                opt.textContent = isNaN(parseInt(num)) ? `Lesson ${num}` : `Lesson ${num}`;
                dropdown.appendChild(opt);
            });

            if (isFirstLoad && sortedLessons.includes(1)) {
                dropdown.value = "1";
                isFirstLoad = false;
            } else if ([...dropdown.options].some(o => o.value === savedValue)) {
                dropdown.value = savedValue;
            }
        }

        function createStatusBadgeMarkup(status) {
            if (status === 'Mastered') {
                return `<span class="flex items-center gap-0.5 px-2 py-0.5 text-[9px] font-black uppercase tracking-wider bg-teal-50 text-teal-700 border border-teal-200 rounded-full">Mastered</span>`;
            } else if (status === 'Troublesome') {
                return `<span class="flex items-center gap-0.5 px-2 py-0.5 text-[9px] font-black uppercase tracking-wider bg-red-50 text-red-700 border border-red-200 rounded-full">Troublesome</span>`;
            } else if (status === 'Learning') {
                return `<span class="flex items-center gap-0.5 px-2 py-0.5 text-[9px] font-black uppercase tracking-wider bg-blue-50 text-blue-700 border border-blue-200 rounded-full">Learning</span>`;
            } else {
                return `<span class="flex items-center gap-0.5 px-2 py-0.5 text-[9px] font-black uppercase tracking-wider bg-gray-50 text-gray-500 border border-gray-200 rounded-full">Unseen</span>`;
            }
        }

        function executeGridSyncRender() {
            const grid = document.getElementById('deck-grid-container');
            const searchVal = document.getElementById('filter-search-string').value.toLowerCase();
            const chosenChapter = document.getElementById('filter-chapter-id').value;
            grid.innerHTML = '';

            const targetData = getActiveDataset();
            const matches = targetData.filter(v => {
                const targetRomajiStr = (v.romaji || v.correctAnswerRomaji || '').toLowerCase();
                const targetEnglishStr = (v.meaningEnglish || v.translationEnglish || '').toLowerCase();
                const targetBanglaStr = (v.meaningBangla || v.translationBangla || '');

                const searchStringMatches = v.japanese.includes(searchVal) || 
                                            (v.kanji && v.kanji.includes(searchVal)) || 
                                            targetRomajiStr.includes(searchVal) || 
                                            targetEnglishStr.includes(searchVal) ||
                                            (targetBanglaStr && targetBanglaStr.includes(searchVal));
                
                const lessonFilterMatches = (searchVal !== '') || chosenChapter === 'all' || String(v.lesson) === chosenChapter;
                
                return searchStringMatches && lessonFilterMatches;
            });

            document.getElementById('ui-filtered-total').textContent = matches.length;
            
            let totalMasteredCount = 0, totalLearningCount = 0;
            matches.forEach(item => {
                const currentStatus = getWordStatus(item.japanese);
                if (currentStatus === 'Mastered') totalMasteredCount++;
                if (currentStatus === 'Learning' || currentStatus === 'Troublesome') totalLearningCount++;

                const cardElement = document.createElement('div');
                cardElement.className = "academic-flashcard group";
                cardElement.onclick = () => speakJapanese(item.japanese);
                cardElement.tabIndex = 0; cardElement.setAttribute('role', 'button');
                cardElement.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); speakJapanese(item.japanese); } };
                
                let jpContentBlock = "";
                if (item.kanji && item.kanji !== "") {
                    jpContentBlock = `<ruby class="font-jp text-3xl font-bold tracking-wide text-primary">${item.kanji}<rt class="text-xs font-normal text-secondary tracking-normal pb-0.5 select-none">${item.japanese}</rt></ruby>`;
                } else if (item.correctAnswerJapanese) {
                    jpContentBlock = `<div class="font-jp text-3xl font-bold tracking-wide text-primary pt-1">${item.japanese} → <span class="text-teal-700">${item.correctAnswerJapanese}</span></div>`;
                } else {
                    jpContentBlock = `<div class="font-jp text-3xl font-bold tracking-wide text-primary pt-3">${item.japanese}</div>`;
                }

                const displayRomaji = item.romaji || item.correctAnswerRomaji || '';
                const displayEnglish = item.meaningEnglish || item.translationEnglish || '';
                const displayBangla = item.meaningBangla || item.translationBangla || '';
                const displayMeta = item.verbGroup ? `<span class="text-[10px] text-tertiary font-bold uppercase tracking-wider block mb-1">${item.verbGroup}</span>` : '';

                // Build HTML block for examples if available
                let examplesMarkup = '';
                if (item.examples && item.examples.length > 0) {
                    examplesMarkup = `<div class="mt-3 pt-3 border-t border-gray-100 space-y-1.5">`;
                    item.examples.forEach(ex => {
                        examplesMarkup += `
                            <div class="bg-gray-50 p-2 rounded text-xs">
                                <div class="font-bold text-slate-800 font-jp">${ex.japanese} <span class="font-mono text-[10px] text-secondary font-normal ml-1">(${ex.romaji})</span></div>
                                <div class="text-secondary text-[11px]">${ex.meaningEnglish} / ${ex.meaningBangla}</div>
                            </div>
                        `;
                    });
                    examplesMarkup += `</div>`;
                }

                cardElement.innerHTML = `
                    <div class="absolute top-4 right-4">${createStatusBadgeMarkup(currentStatus)}</div>
                    <div class="flex flex-col mb-4">
                        <div class="min-h-[56px] flex items-end mb-2">
                            ${jpContentBlock}
                        </div>
                        ${displayMeta}
                        <div class="font-mono text-xs text-secondary font-bold tracking-tight mb-1">${displayRomaji}</div>
                        <div class="text-base font-bold text-slate-800 leading-snug">${displayEnglish}</div>
                        <div class="text-sm text-secondary mt-0.5 font-medium">${displayBangla}</div>
                        ${examplesMarkup}
                    </div>
                    <div class="mt-auto pt-3 border-t border-gray-100 flex justify-between items-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                        <span>Ch. ${item.lesson}</span>
                        <span class="text-primary flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity">
                            Listen <svg class="ico w-3.5 h-3.5" aria-hidden="true"><use href="#i-volume"/></svg>
                        </span>
                    </div>
                `;
                grid.appendChild(cardElement);
            });

            document.getElementById('ui-mastered-total').textContent = totalMasteredCount;
            document.getElementById('ui-learning-total').textContent = totalLearningCount;
        }
    </script>
</body>
</html>
